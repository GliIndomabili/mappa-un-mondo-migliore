</style></head><body><header><div><small>ROBERTO SANVITO · ATLANTE NARRATIVO</small><h1>GLI INDOMABILI <span style="color:#cb5d50">/ UN MONDO MIGLIORE</span></h1></div><div class="right">ITALIA E OLTRE · 2018—2021<br>32 LUOGHI / 1 DESTINO</div></header><main><aside id="left"><div id="filters"><div class="eyebrow">ARCHIVIO DEI LUOGHI</div><p>Seleziona un luogo dall'elenco o un segnaposto sulla mappa per leggerne la storia.</p><input id="query" type="search" placeholder="Cerca un luogo, un personaggio…" aria-label="Cerca"><select id="region" aria-label="Filtra per area"><option value="">Tutte le aree</option></select><p style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0"><span id="count">32 LUOGHI</span><button id="all" style="border:0;background:none;color:#d87b69;cursor:pointer">Azzera filtri</button></p></div><div id="list"></div></aside><section class="map-wrap"><div id="map" aria-label="Mappa interattiva dei luoghi"></div></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const DATA=[{"n":1,"place":"MILANO CORVETTO","title":"Il Grande Volo","sub":"Dove tutto ha inizio","desc":"Il 5 giugno 2018, alle 18.42, un uomo si getta dal settimo piano di un palazzo. Sulla maglietta porta una profezia: mancano 1096 giorni alla fine del mondo. Le immagini sconvolgono il Paese. Tra la folla, un misterioso spettatore si allontana senza mostrare alcuna emozione.","lat":45.44353127584751,"lon":9.222004825193638,"region":"Lombardia"},{"n":2,"place":"MILANO, PORTA NUOVA","title":"Viva la Vita","sub":"Sede del movimento che vuole godersi la fine del mondo","desc":"Un anno dopo il Grande Volo, il movimento Viva la Vita celebra la sua nascita tra feste, eccessi e proclami. Felice Di Dio ne è diventato il volto pubblico, mentre Francesco Carlo osserva con crescente rancore l'uomo al quale ha consegnato la propria creatura.","lat":45.48405369058408,"lon":9.189261809855882,"region":"Lombardia"},{"n":3,"place":"NAPOLI, VOMERO","title":"La casa della Ragione","sub":"Il quartier generale dei Razionalisti","desc":"In una villa del Vomero vive Pasquale Marriale, leader del movimento dei Razionalisti. In televisione predica logica e razionalità, ma tra le mura domestiche governa attraverso paura e violenza. Il suo movimento è destinato a scontrarsi con Viva la Vita.","lat":40.84470257195105,"lon":14.239998487760513,"region":"Campania"},{"n":4,"place":"ROMA, MONTE SACRO ALTO","title":"Villa Selva Nera","sub":"Il cuore segreto dell'Oronero","desc":"In una villa nascosta nella zona nord di Roma, sette figure del potere italiano siedono attorno a una tavola ovale. A guidarle è un uomo enigmatico, chiamato il Coordinatore. Qui si progettano divisioni, crisi e conflitti. Perché un popolo diviso è molto più facile da controllare.","lat":41.954187290092214,"lon":12.561256509649372,"region":"Lazio"},{"n":5,"place":"ROMA, QUIRINALE","title":"La Tavola Rotonda","sub":"Il Consiglio Supremo di Difesa","desc":"Nella Sala degli Arazzi del Quirinale, le massime autorità dello Stato affrontano l'emergenza dei due movimenti contrapposti. La riunione si conclude senza decisioni. Ma quando la sala si svuota, una telefonata riservata rivela che qualcuno ha già scelto il destino dell'Italia.","lat":41.90044411007298,"lon":12.486521540326798,"region":"Lazio"},{"n":6,"place":"ROMA, VIGNA CLARA","title":"L'ufficio del Maestro","sub":"Dove gli ordini diventano operazioni","desc":"In un elegante ufficio di Vigna Clara, Antonio De Sanctis, detto il Maestro, dirige una struttura dei Servizi ormai al servizio dell'Oronero. Al suo fianco striscia Lorenzo Persichetti. Da queste stanze partono incarichi clandestini destinati a cambiare gli equilibri del Paese.","lat":41.94850366426599,"lon":12.465821896154226,"region":"Lazio"},{"n":7,"place":"GUBBIO, CARBONESCA · BOCCALINO","title":"Il casale","sub":"Il rifugio di Paolo Barbieri","desc":"Tra le colline umbre, Paolo Barbieri si è costruito una nuova vita, lontano dalla Milano della giovinezza. Qui convive con un passato che non ha mai smesso di inseguirlo. Un luogo apparentemente tranquillo, destinato a diventare sempre più importante.","lat":43.20476753976184,"lon":12.612560221477983,"region":"Umbria"},{"n":8,"place":"LUGANO","title":"CarloGroup","sub":"Il denaro dietro Viva la Vita","desc":"Nella sua villa di Lugano, Francesco Carlo gestisce interessi economici e ambizioni personali. È lui il finanziatore originario di Viva la Vita, ma il successo di Felice Di Dio ha trasformato il loro rapporto in una rivalità feroce.","lat":46.002568074432986,"lon":8.949959409887288,"region":"Svizzera"},{"n":9,"place":"MILANO, CASCINA GOBBA","title":"Autogrill Cascina Gobba","sub":"Una pausa fatale","desc":"Area di servizio di Cascina Gobba, lungo la Tangenziale Est di Milano. Una sosta. Un killer. Un bersaglio. In pochi secondi, un'operazione clandestina è destinata ad alimentare lo scontro tra due movimenti.","lat":45.50697405632176,"lon":9.260885196362413,"region":"Lombardia"},{"n":10,"place":"ROMA, EUR","title":"La casa sicura","sub":"Un rifugio dei Servizi Segreti","desc":"Nel quartiere EUR, lontano dagli occhi indiscreti, un appartamento viene utilizzato per operazioni che non devono lasciare tracce. Un luogo anonimo, protetto dalla riservatezza, dove le missioni dei Servizi mostrano il loro volto più oscuro.","lat":41.82635184673021,"lon":12.474966267312302,"region":"Lazio"},{"n":11,"place":"GENOVA, PONTE SAN GIORGIO","title":"Il ponte di Genova","sub":"Un ponte, una città, una missione","desc":"Il Ponte San Giorgio, simbolo della ricostruzione dopo la tragedia del Morandi, diventa uno dei riferimenti geografici di una storia nella quale anche le infrastrutture e i luoghi della vita quotidiana possono trasformarsi in scenari di pericolo.","lat":44.426394597369516,"lon":8.887896838627691,"region":"Liguria"},{"n":12,"place":"HOUSTON, TEXAS, STATI UNITI","title":"Houston abbiamo un problema","sub":"L'ombra della fine del mondo","desc":"Il centro spaziale di Houston rappresenta uno dei luoghi simbolo della ricerca scientifica mondiale. Mentre in Italia la profezia del Grande Volo divide la popolazione, lo sguardo si sposta oltre l'Atlantico, dove la scienza scopre altri pericoli per l'umanità.","lat":29.553094635419907,"lon":-95.09337480445767,"region":"Stati Uniti"},{"n":13,"place":"ROMA, VATICANO","title":"Custodes Urbis","sub":"I Custodi della Città","desc":"Nel cuore del Vaticano nasce una nuova realtà destinata ad assumere un ruolo centrale negli equilibri della capitale. Tra fede, sicurezza e potere, i Custodes Urbis rappresentano una delle forze che emergono mentre l'Italia scivola verso una divisione sempre più profonda.","lat":41.90261512083044,"lon":12.453000837484641,"region":"Vaticano"},{"n":14,"place":"ROMA, SAN BASILIO","title":"I Derelitti","sub":"Gli esclusi diventano una forza","desc":"Nel quadrante orientale di Roma, il quartiere di San Basilio diventa il territorio dei Derelitti. Un mondo ai margini della società, dove l'emarginazione e la sopravvivenza danno vita a una nuova forma di organizzazione. Una realtà pronta a essere sfruttata dal potere oscuro.","lat":41.94002014473092,"lon":12.583159791676389,"region":"Lazio"},{"n":15,"place":"MILANO SUD, POASCO","title":"La Corte Musulmana","sub":"Una nuova comunità, un nuovo potere","desc":"A sud di Milano, nell'area dell'ex Corte Nova, prende forma la Corte Musulmana. In un Paese che si sta frammentando in territori e comunità contrapposte, anche questa realtà si organizza per difendere la propria identità e conquistare un ruolo nel nuovo equilibrio delle forze.","lat":45.405493687480394,"lon":9.227879097212247,"region":"Lombardia"},{"n":16,"place":"MILANO, CHINATOWN","title":"E i cinesi non chiudono mai","sub":"Chinatown, un mondo dentro Milano","desc":"Tra via Paolo Sarpi e le strade della Chinatown milanese, la comunità cinese continua a vivere e organizzarsi mentre il resto del Paese precipita nel caos. Un quartiere con le proprie regole, i propri interessi e una capacità di adattamento che diventa una risorsa fondamentale.","lat":45.48155611118773,"lon":9.17583444340183,"region":"Lombardia"},{"n":17,"place":"MILANO, CORVETTO","title":"El Grande Barrio","sub":"Il Corvetto cambia padrone","desc":"Nel quartiere dove tutto era cominciato con il Grande Volo, emerge una nuova forza: El Grande Barrio, un’organizzazione di latinos che si muove secondo regole proprie.","lat":45.4402713604476,"lon":9.222102449851448,"region":"Lombardia"},{"n":18,"place":"MILANO, PORTA ROMANA","title":"Batteria di Porta Romana","sub":"Il quartier generale","desc":"In piazzale Medaglie d'Oro, negli spazi delle ex Terme di Milano, prende forma un luogo che riunisce personaggi, storie e legami. Non si tratta solo di amicizia, ma di sopravvivenza.","lat":45.451882097671614,"lon":9.201613529264316,"region":"Lombardia","listTitle":"Gli amici di Porta Romana"},{"n":19,"place":"ROMA, EUR","title":"Grand Hotel Regina Augusta Palace","sub":"Il regno nero del Boia","desc":"Mentre Roma è ormai un campo di battaglia, nel cuore dell'EUR, un albergo di lusso è diventato una cittadella fortificata sotto il controllo del Boia dell'EUR. A capo della sua 'Legione' cerca di prendersi la città.","lat":41.835277138280716,"lon":12.472359880807648,"region":"Lazio"},{"n":20,"place":"MILANO, NOLO","title":"Casa di Lady Ganja","sub":"Lady Ganja mantiene sempre la parola","desc":"Nel quartiere NoLo, a nord di piazzale Loreto, si intrecciano le vicende affettive di Lady Ganja, una delle figure più imprevedibili e pericolose al soldo dei servizi segreti. Dietro l'aspetto provocante e i modi disinvolti si nasconde una donna capace di trasformare ogni incarico in una questione personale.","lat":45.49108321505247,"lon":9.215457796361475,"region":"Lombardia"},{"n":21,"place":"MILANO, OPERA","title":"Il carcere di Opera","sub":"Брат за брата, fratello per fratello","desc":"Nel braccio di Alta Sicurezza del carcere di Opera, Vladimir Stanković sconta i suoi ergastoli. Un passato di sangue, vendette e rivalità tra clan serbi e albanesi lo ha condotto dietro le sbarre. Ma una visita inattesa potrebbe cambiare il suo destino e quello dei suoi compagni.","lat":45.39639777686331,"lon":9.206866884659789,"region":"Lombardia"},{"n":22,"place":"ROMA, CINECITTÀ","title":"Televisione Pubblica Italiana","sub":"La battaglia per il controllo dell'informazione","desc":"Nel centro televisivo della TPI, a Cinecittà, uomini armati della Divisione Ombra prendono il controllo della televisione pubblica. Gli studi vengono militarizzati e ogni trasmissione sottoposta a sorveglianza. L'informazione diventa un'arma nelle mani di chi vuole controllare il Paese.","lat":41.85009534213088,"lon":12.574019917438221,"region":"Lazio"},{"n":23,"place":"SAN DONATO MILANESE","title":"Orbis Media Group","sub":"Il prezzo dell'indipendenza","desc":"A San Donato Milanese ha sede la filiale italiana di Orbis Media Group, colosso europeo delle telecomunicazioni e dell'intrattenimento. La società ha scelto di raccontare gli avvenimenti senza schierarsi. Ma nell'Italia dell'Oronero anche la neutralità può diventare una condanna.","lat":45.4339908175341,"lon":9.241720709852832,"region":"Lombardia"},{"n":24,"place":"VIMODRONE, MILANO","title":"Aurea Media","sub":"La purga dell'informazione","desc":"A Vimodrone sorge il principale polo televisivo commerciale italiano. Troppo importante per non essere un obiettivo. Infatti qualcuno decide di trasformare la televisione in uno strumento del nuovo potere rivoluzionario.","lat":45.51187534862409,"lon":9.29650849636273,"region":"Lombardia"},{"n":25,"place":"MOLTRASIO, LAGO DI COMO","title":"La villa sul lago","sub":"Sangue e violenza","desc":"Sulle rive del Lago di Como, a Moltrasio, una villa diventa lo scenario di un passaggio decisivo nella storia di Elisabetta Zanatta, conosciuta come Gilda. Il passato che porta con sé la trascina ancora una volta in un gioco pericoloso dal quale è sempre più difficile uscire.","lat":45.86010272900406,"lon":9.101456431043593,"region":"Lombardia"},{"n":26,"place":"ROMA, CIMITERO DEL VERANO","title":"Il tesoro del Notaio","sub":"Un segreto nascosto tra le tombe","desc":"Nel Cimitero Monumentale del Verano, un uomo conosciuto come il Notaio cerca qualcosa che ha nascosto anni prima. Tra i vialetti e le tombe riposa un piccolo oggetto capace di custodire informazioni pericolose. Un tesoro che potrebbe rivelarsi molto più prezioso dell'oro.","lat":41.9017070786658,"lon":12.520309228835059,"region":"Lazio"},{"n":27,"place":"ROMA, PRATI","title":"Casa Marilena Fioretti","sub":"La fuga","desc":"Nel quartiere Prati, tra barricate, camion ribaltati e bande armate, Marilena Fioretti prepara una fuga disperata. Non ha alleati né protezioni. Per raggiungere la sua meta dovrà attraversare un'Italia ormai fuori controllo.","lat":41.91332517368638,"lon":12.459947414929415,"region":"Lazio"},{"n":28,"place":"CASACASTALDA, VALFABBRICA, PERUGIA","title":"Il mercato degli scambi","sub":"Quando il denaro non vale più nulla","desc":"Nella piazzetta davanti alla Chiesa di Santa Maria Assunta, gli abitanti di Casacastalda si ritrovano per barattare cibo, medicinali e oggetti di prima necessità. Un mercato nato per sopravvivere, dove una tranquilla giornata può trasformarsi improvvisamente in un incubo.","lat":43.19673612587997,"lon":12.648045033558951,"region":"Umbria"},{"n":29,"place":"ROMA, QUARTIERE COPPEDÈ","title":"Casa Lorenzo Persichetti","sub":"Un uomo prigioniero delle proprie ossessioni","desc":"Tra gli edifici fiabeschi del quartiere Coppedè, Lorenzo Persichetti vive isolato nel suo appartamento tra rabbia e ossessione. I ricordi lo tormentano e una donna continua a occupare ogni suo pensiero.","lat":41.919578887931685,"lon":12.501167428868294,"region":"Lazio"},{"n":30,"place":"GUBBIO, CARBONESCA","title":"Casa di Titti","sub":"Una resa dei conti lontano da occhi indiscreti","desc":"Un uomo abituato a comandare e umiliare si ritrova improvvisamente senza potere, davanti a persone che credeva di avere distrutto. Questa volta le regole sono cambiate.","lat":43.201824479723996,"lon":12.612842281302196,"region":"Umbria"},{"n":31,"place":"COLLI PIACENTINI, VIDIANO DA CAPO","title":"Oasi ricovero cani randagi","sub":"Bisogno di cazzo!","desc":"Tra le colline piacentine, Arturo Carlino vive con Katrine e i loro inseparabili cani. La tranquillità della villa viene interrotta da una richiesta decisamente insolita. Arturo scoprirà che, per contribuire a salvare il mondo, potrebbe dover rispolverare certi talenti del passato.","lat":44.923518022219504,"lon":9.456505060008423,"region":"Emilia-Romagna","listTitle":"Oasi ricovero cani randagi"},{"n":32,"place":"SAINT MORITZ, SVIZZERA","title":"La magione del Conte","sub":"L'ultima orgia","desc":"In una sontuosa residenza di Saint Moritz, il Conte Annibale Cavazzi organizza una serata di lusso e trasgressione. Tra maschere veneziane, champagne e ospiti esclusivi l'evento nasconde uno scopo molto diverso dal semplice divertimento. Una missione rischiosa, dove seduzione e pericolo si incontrano.","lat":46.484570983780685,"lon":9.818161684659788,"region":"Svizzera"}];let current=null;const markers=new Map();const map=L.map('map',{zoomControl:false,worldCopyJump:true}).setView([43.3,11.7],6);L.control.zoom({position:'bottomleft'}).addTo(map);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',{attribution:'Tiles © Esri',maxZoom:19,subdomains:'abcd'}).addTo(map);const list=document.getElementById('list'),query=document.getElementById('query'),region=document.getElementById('region');const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function pin(d){return L.divIcon({className:'',html:`<div class="pin ${current===d.n?'selected':''}"></div>`,iconSize:[25,25],iconAnchor:[12,12]})}function popup(d){return `<h2 class="popup-title">${safe(d.title)}</h2><div class="popup-sub">${safe(d.sub)}</div><div class="popup-place">${safe(d.place)}</div><div class="popup-desc">${safe(d.desc)}</div>`}DATA.forEach(d=>{const m=L.marker([d.lat,d.lon],{icon:pin(d)}).addTo(map);m.bindPopup(popup(d),{maxWidth:350,autoPan:true});m.on('click',()=>choose(d.n,false));markers.set(d.n,m)});function render(){const q=query.value.trim().toLowerCase(),r=region.value;list.innerHTML='';const shown=DATA.filter(d=>(!r||d.region===r)&&(!q||`${d.title} ${d.listTitle||''} ${d.place} ${d.sub} ${d.desc}`.toLowerCase().includes(q)));shown.forEach(d=>{const b=document.createElement('button');b.className='item'+(d.n===current?' active':'');b.innerHTML=`<span class="t">${safe(d.listTitle||d.title)}</span><span class="p">${safe(d.place)}</span>`;b.onclick=()=>choose(d.n,true);list.appendChild(b)});document.getElementById('count').textContent=`${shown.length} LUOGHI`;DATA.forEach(d=>{const m=markers.get(d.n);if(shown.includes(d)){if(!map.hasLayer(m))m.addTo(map)}else map.removeLayer(m)});if(!shown.length)list.innerHTML='<div style="padding:20px;color:#aaa">Nessun luogo trovato.</div>'}function choose(n,fly){const d=DATA.find(x=>x.n===n);if(!d)return;current=n;markers.forEach((m,k)=>m.setIcon(pin(DATA.find(x=>x.n===k))));render();const m=markers.get(n);if(fly){map.flyTo([d.lat,d.lon],Math.max(map.getZoom(),d.region==='Stati Uniti'?5:10),{duration:.8});map.closePopup()}else m.openPopup()}query.addEventListener('input',render);region.addEventListener('change',render);document.getElementById('all').onclick=()=>{query.value='';region.value='';map.closePopup();current=null;render();map.fitBounds(L.latLngBounds(DATA.filter(d=>d.region!=='Stati Uniti').map(d=>[d.lat,d.lon])),{padding:[35,35]})};[...new Set(DATA.map(x=>x.region))].sort().forEach(x=>{const opt=document.createElement('option');opt.value=x;opt.textContent=x;region.appendChild(opt)});render();map.fitBounds(L.latLngBounds(DATA.filter(d=>d.region!=='Stati Uniti').map(d=>[d.lat,d.lon])),{padding:[35,35]});</script><
